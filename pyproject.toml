[project]
name = "phasmix-mock"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pavadol Yamsiri", email = "pavyamsiri@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.4",
    "optype[numpy]>=0.17.0",
    "scipy>=1.17.1",
    "scipy-stubs>=1.17.1.4",
    "strictyaml>=1.7.3",
    "strictyaml-stubs",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "phasmock"

[tool.uv.sources]
strictyaml-stubs = { git = "https://github.com/pavyamsiri/strictyaml-stubs.git" }

[dependency-groups]
dev = [
    "matplotlib>=3.10.9",
    "pytest>=9.1.1",
]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY001",
    "COM812",
    "D100",
    "D103",
    "D203",
    "D213",
    "ISC001",
    "PLR0913",
    "PLR0915",
    "PLR2004",
    "S101",
    "TD003",
    "C901",
]

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = ["S101"]
